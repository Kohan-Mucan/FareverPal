<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="glossyRed" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="40%" stop-color="#e60000"/>
      <stop offset="100%" stop-color="#8a0000"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Smaller radius to add padding -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="16" cy="16" r="8.5" fill="url(#glossyRed)"/>
  <ellipse cx="13" cy="13" rx="2.5" ry="1.5" fill="#ffffff" transform="rotate(-30 13 13)" opacity="0.5"/>
