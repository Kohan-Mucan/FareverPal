<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="darkerBlue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#29b6f6"/>
      <stop offset="50%" stop-color="#0288d1"/>
      <stop offset="100%" stop-color="#0b3c5d"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- 1) Brown shaft (with RED outline - 2px longer) -->
    <rect x="13.25" y="7" width="5.5" height="18.5" fill="#8d6e63" stroke="#ff1744" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- 2) Red tail feathers (with yellow outline - shifted down) -->
    <polygon points="14,24.5 6,30 8.5,31.5 14,27.5" fill="#ff1744" stroke="#ffeb3b" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="18,24.5 26,30 23.5,31.5 18,27.5" fill="#ff1744" stroke="#ffeb3b" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- 3) Arrowhead (Blue with yellow outline - shifted up) -->
    <polygon points="16,0.5 25.5,8 6.5,8" fill="url(#darkerBlue)" stroke="#ffeb3b" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- 4) "Kohan" Text in cyan -->
    <text x="16" y="16.8" 
          fill="#00e5ff" 
          font-family="monospace" 
          font-size="3" 
          font-weight="900" 
          text-anchor="middle"
          transform="rotate(90 16 16.5)">Kohan</text>
  </g>
</svg>
